[package]
name = "kern"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
build = "scripts/build.rs"
license = "MIT"
description = "Portable context metaharness with bounded Markdown delivery and MCP support"
repository = "https://github.com/ethvor/kern"
readme = "README.md"
keywords = ["ai", "agents", "mcp", "context", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
globset = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
